services:
  - type: web
    name: waywealth
    env: node
    plan: free
    buildCommand: npm ci --no-audit
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BACKUP_INTERVAL_MIN
        value: 10
      - key: BACKUP_ON_WRITE
        value: 1
      # ── REQUIRED on Render dashboard (Environment → Add, mark Secret):
      # DATABASE_URL = postgres://avnadmin:...@pg-...aivencloud.com:20172/defaultdb?sslmode=require
      # ADMIN_EMAIL / ADMIN_PASSWORD = your login (optional override)
