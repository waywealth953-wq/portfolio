services:
  - type: web
    name: waywealth
    env: node
    plan: free
    buildCommand: npm ci --no-audit; npm rebuild sqlite3 --build-from-source || npm install --build-from-source
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Change these after first deploy in Render dashboard:
      # JWT_SECRET = long random string
      # Optionally override admin password via env (handled in server.js if you add it)
